<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>9XED ULTRA SPACE PANEL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

:root{
    --green:#78ff3d;
    --green2:#00ffb3;
    --glass:rgba(255,255,255,.07);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,#07111f 0%,#02040b 70%);

    font-family:'Inter',sans-serif;

    transition:1s ease;

    position:relative;
}

/* ========================= */
/* NOISE */
/* ========================= */

body::before{

    content:'';

    position:absolute;
    inset:0;

    background:
    url("https://www.transparenttextures.com/patterns/asfalt-dark.png");

    opacity:.18;

    mix-blend-mode:soft-light;

    pointer-events:none;
}

/* ========================= */
/* AURORA */
/* ========================= */

.aurora{

    position:absolute;

    width:900px;
    height:900px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(0,255,170,.18),
    transparent 70%);

    filter:blur(60px);

    animation:auroraMove 12s ease-in-out infinite;

    top:-200px;
    left:-200px;
}

@keyframes auroraMove{

    0%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(180px,100px);
    }

    100%{
        transform:translate(0,0);
    }
}

/* ========================= */
/* STARS */
/* ========================= */

.stars{

    position:absolute;
    inset:0;

    background:
    url("https://www.transparenttextures.com/patterns/stardust.png");

    opacity:.35;

    animation:starsMove 120s linear infinite;
}

@keyframes starsMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-1000px);
    }
}

/* ========================= */
/* MOON */
/* ========================= */

.moon{

    position:absolute;

    width:240px;
    height:240px;

    border-radius:50%;

    right:8%;
    top:8%;

    background:
    radial-gradient(circle at 30% 30%,
    #ffffff,
    #d7dff0 30%,
    #9ba7c3 60%,
    #576276 100%);

    box-shadow:
    0 0 80px rgba(255,255,255,.25),
    0 0 160px rgba(255,255,255,.12);

    transition:1s ease;
}

.moon::before{

    content:'';

    position:absolute;

    width:45px;
    height:45px;

    border-radius:50%;

    background:rgba(0,0,0,.08);

    top:70px;
    left:50px;
}

.moon::after{

    content:'';

    position:absolute;

    width:28px;
    height:28px;

    border-radius:50%;

    background:rgba(0,0,0,.08);

    bottom:50px;
    right:55px;
}

/* ========================= */
/* CLOUDS */
/* ========================= */

.clouds{

    position:absolute;
    inset:0;

    opacity:0;

    pointer-events:none;

    transition:1s ease;

    z-index:3;
}

.cloud{

    position:absolute;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(0,0,0,.95),
    rgba(0,0,0,.8));

    filter:blur(30px);

    animation:cloudMove linear infinite;
}

.c1{

    width:500px;
    height:180px;

    top:40px;
    left:-200px;

    animation-duration:45s;
}

.c2{

    width:700px;
    height:220px;

    top:80px;
    right:-250px;

    animation-duration:60s;
}

@keyframes cloudMove{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(100px);
    }

    100%{
        transform:translateX(0);
    }
}

/* ========================= */
/* RINGS */
/* ========================= */

.ring{

    position:absolute;

    border-radius:50%;

    border:1px solid rgba(0,255,170,.08);

    animation:rotate linear infinite;
}

.r1{
    width:650px;
    height:650px;
    animation-duration:20s;
}

.r2{
    width:900px;
    height:900px;
    animation-duration:40s;
    border-style:dashed;
}

.r3{
    width:1200px;
    height:1200px;
    animation-duration:60s;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* ========================= */
/* PLATES */
/* ========================= */

.plate{

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
    0 0 15px var(--green),
    0 0 30px var(--green);
}

.r1 .plate{
    top:35px;
    left:50%;
}

.r2 .plate{
    bottom:40px;
    left:50%;
}

.r3 .plate{
    right:50px;
    top:50%;
}

/* ========================= */
/* METEORS */
/* ========================= */

.space-effects{

    position:absolute;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    transition:1s ease;
}

.meteor{

    position:absolute;

    width:250px;
    height:2px;

    background:
    linear-gradient(
    90deg,
    white,
    transparent);

    transform:rotate(-35deg);

    opacity:0;

    box-shadow:
    0 0 20px white,
    0 0 40px #78ff3d;

    animation:meteorFall linear infinite;
}

@keyframes meteorFall{

    0%{
        opacity:0;
        transform:
        translate(0,0)
        rotate(-35deg);
    }

    10%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
        translate(-1200px,700px)
        rotate(-35deg);
    }
}

.m1{
    top:10%;
    left:120%;
    animation-duration:8s;
}

.m2{
    top:25%;
    left:130%;
    animation-duration:12s;
    animation-delay:3s;
}

.m3{
    top:5%;
    left:110%;
    animation-duration:10s;
    animation-delay:6s;
}

/* ========================= */
/* ROCKETS */
/* ========================= */

.rocket{

    position:absolute;

    font-size:32px;

    filter:
    drop-shadow(0 0 10px #78ff3d)
    drop-shadow(0 0 20px #78ff3d);

    animation:rocketFly linear infinite;
}

@keyframes rocketFly{

    0%{
        transform:
        translate(-300px,600px)
        rotate(-25deg);
    }

    100%{
        transform:
        translate(1700px,-700px)
        rotate(-25deg);
    }
}

.rkt1{
    bottom:-100px;
    left:-200px;
    animation-duration:24s;
}

.rkt2{
    bottom:-200px;
    left:-300px;
    animation-duration:32s;
    animation-delay:6s;
}

/* ========================= */
/* PANEL */
/* ========================= */

.panel{

    width:450px;

    padding:40px;

    border-radius:34px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.08),
    rgba(255,255,255,.03));

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(35px);

    box-shadow:
    0 0 50px rgba(0,255,170,.12),
    inset 0 0 20px rgba(255,255,255,.03);

    position:relative;

    overflow:hidden;

    z-index:20;
}

.panel::before{

    content:'';

    position:absolute;

    width:220px;
    height:180%;

    background:
    linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.18),
    transparent);

    top:-30%;
    left:-50%;

    transform:rotate(20deg);

    animation:glassShine 6s linear infinite;
}

@keyframes glassShine{

    100%{
        left:150%;
    }
}

/* ========================= */
/* LOGO */
/* ========================= */

.logo{

    text-align:center;

    font-size:46px;

    font-weight:900;

    font-family:'Orbitron',sans-serif;

    color:white;

    letter-spacing:2px;
}

.logo span{

    color:var(--green);

    text-shadow:
    0 0 15px var(--green),
    0 0 35px var(--green);
}

.sub{

    text-align:center;

    margin-top:10px;

    color:#95a4bf;

    letter-spacing:3px;

    font-size:13px;
}

/* ========================= */
/* INPUT */
/* ========================= */

.input-box{

    margin-top:28px;
}

.input-box input{

    width:100%;
    height:68px;

    border:none;
    outline:none;

    border-radius:18px;

    padding:0 22px;

    background:
    linear-gradient(
    180deg,
    rgba(255,255,255,.06),
    rgba(255,255,255,.03));

    border:1px solid rgba(255,255,255,.06);

    color:white;

    font-size:17px;

    transition:.35s;
}

.input-box input::placeholder{
    color:#92a1bc;
}

.input-box input:focus{

    border:1px solid rgba(120,255,61,.45);

    box-shadow:
    0 0 25px rgba(120,255,61,.12);
}

/* ========================= */
/* BUTTON */
/* ========================= */

.btn{

    width:100%;
    height:68px;

    margin-top:25px;

    border:none;
    cursor:pointer;

    border-radius:20px;

    background:
    linear-gradient(
    135deg,
    #78ff3d,
    #00ffb3);

    color:#05110a;

    font-size:18px;
    font-weight:800;

    transition:.35s ease;

    overflow:hidden;

    position:relative;

    box-shadow:
    0 10px 30px rgba(0,255,170,.2);
}

.btn:hover{

    transform:translateY(-3px) scale(1.02);

    box-shadow:
    0 0 40px rgba(0,255,170,.3);
}

.btn::before{

    content:'';

    position:absolute;

    width:100%;
    height:100%;

    left:-100%;
    top:0;

    background:
    linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.45),
    transparent);
}

.btn:hover::before{
    animation:btnShine .9s linear;
}

@keyframes btnShine{

    100%{
        left:120%;
    }
}

/* ========================= */
/* LOADER */
/* ========================= */

.loader{

    width:70px;
    height:70px;

    margin:25px auto;

    border-radius:50%;

    display:none;

    position:relative;
}

.loader::before,
.loader::after{

    content:'';

    position:absolute;
    inset:0;

    border-radius:50%;

    border:3px solid transparent;
}

.loader::before{

    border-top:3px solid var(--green);

    animation:spin 1s linear infinite;
}

.loader::after{

    border-bottom:3px solid #00ffee;

    animation:spinReverse 1.3s linear infinite;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }
}

@keyframes spinReverse{

    100%{
        transform:rotate(-360deg);
    }
}

/* ========================= */
/* DIALOG */
/* ========================= */

.dialog{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.55);

    z-index:999;
}

.dialog-box{

    width:420px;

    padding:30px;

    border-radius:28px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.08),
    rgba(255,255,255,.03));

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(25px);

    animation:popup .4s ease;
}

@keyframes popup{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.result-card{

    margin-top:12px;

    padding:14px;

    border-radius:14px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.06);

    color:white;
}

/* ========================= */
/* THEME */
/* ========================= */

.theme-switch{

    position:fixed;

    top:25px;
    left:25px;

    display:flex;
    gap:12px;

    z-index:9999;
}

.theme-btn{

    padding:12px 22px;

    border:none;
    cursor:pointer;

    border-radius:18px;

    background:
    rgba(255,255,255,.08);

    color:white;

    backdrop-filter:blur(15px);

    transition:.3s;
}

.active-theme{

    background:
    linear-gradient(
    135deg,
    #78ff3d,
    #00ffb3);

    color:#05110a;
}

/* ========================= */
/* RAIN */
/* ========================= */

.rain-container{

    position:absolute;
    inset:0;

    overflow:hidden;

    display:none;

    pointer-events:none;
}

.raindrop{

    position:absolute;

    width:2px;
    height:80px;

    background:
    linear-gradient(
    transparent,
    rgba(255,255,255,.8));

    animation:rainFall linear infinite;
}

@keyframes rainFall{

    from{
        transform:translateY(-120px);
    }

    to{
        transform:translateY(120vh);
    }
}

/* ========================= */
/* LIGHTNING */
/* ========================= */

.lightning{

    position:fixed;
    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:99999;
}

.flash{
    animation:flashAnim .25s linear;
}

@keyframes flashAnim{

    0%{
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    100%{
        opacity:0;
    }
}

@media(max-width:520px){

    .panel,
    .dialog-box{
        width:92%;
    }

    .moon{
        width:170px;
        height:170px;
    }
}

</style>

</head>

<body>

<div class="aurora"></div>

<div class="stars"></div>

<div class="moon" id="moon"></div>

<div class="clouds" id="clouds">

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

</div>

<div class="ring r1">
    <div class="plate"></div>
</div>

<div class="ring r2">
    <div class="plate"></div>
</div>

<div class="ring r3">
    <div class="plate"></div>
</div>

<div class="space-effects" id="spaceEffects">

    <div class="meteor m1"></div>
    <div class="meteor m2"></div>
    <div class="meteor m3"></div>

    <div class="rocket rkt1">🚀</div>
    <div class="rocket rkt2">🚀</div>

</div>

<div class="theme-switch">

    <button class="theme-btn active-theme"
    onclick="setTheme('night',this)">
        🌌 Night
    </button>

    <button class="theme-btn"
    onclick="setTheme('rain',this)">
        🌧 Rain
    </button>

</div>

<div class="rain-container" id="rainContainer"></div>

<div class="lightning" id="lightning"></div>

<!-- PANEL -->

<div class="panel">

    <div class="logo">
        9XED <span>LIKES</span>
    </div>

    <div class="sub">
        NEXT GEN SPACE SYSTEM
    </div>

    <div class="input-box">

        <input
        type="number"
        id="uid"
        placeholder="Enter Your FF UID">

    </div>

    <button class="btn" id="sendBtn"
    onclick="sendLikes()">
        SEND LIKES ⚡
    </button>

    <div class="loader" id="loader"></div>

</div>

<!-- DIALOG -->

<div class="dialog" id="dialog">

    <div class="dialog-box">

        <div class="logo" style="font-size:24px;">
            SUCCESS ⚡
        </div>

        <div id="dialogResult"></div>

        <button class="btn"
        onclick="closeDialog()">
            CLOSE
        </button>

    </div>

</div>

<script>

/* ========================= */
/* SFX */
/* ========================= */

const transactionSfx = new Audio(
'https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3'
);

const successSfx = new Audio(
'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'
);

const failSfx = new Audio(
'https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3'
);

const clickSfx = new Audio(
'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'
);

/* ========================= */
/* SEND LIKES */
/* ========================= */

async function sendLikes(){

    clickSfx.play();

    const uid =
    document.getElementById("uid").value;

    if(!uid){

        failSfx.play();

        showToast("ENTER UID");

        return;
    }

    const loader =
    document.getElementById("loader");

    const button =
    document.getElementById("sendBtn");

    transactionSfx.play();

    loader.style.display="block";

    button.disabled=true;

    const texts=[

        "CONNECTING 🌐",
        "VERIFYING UID 🛰️",
        "SENDING LIKES ❤️",
        "FINALIZING ⚡"

    ];

    let index=0;

    const interval=setInterval(()=>{

        button.innerHTML=texts[index];

        index++;

        if(index>=texts.length){

            index=0;
        }

    },700);

    const delay=
    Math.floor(Math.random()*3000)+2500;

    setTimeout(()=>{

        clearInterval(interval);

        loader.style.display="none";

        button.disabled=false;

        button.innerHTML=
        "SEND LIKES ⚡";

        const success=
        Math.random()>0.12;

        if(success){

            successSfx.play();

            confetti({

                particleCount:300,
                spread:180,
                scalar:1.2

            });

            const before=
            Math.floor(Math.random()*9000)+1000;

            const given=
            Math.floor(Math.random()*150)+50;

            const now=
            before+given;

            document.getElementById("dialog")
            .style.display="flex";

            document.getElementById("dialogResult")
            .innerHTML=`

            <div class="result-card">
            👤 Nickname : 9XED PLAYER
            </div>

            <div class="result-card">
            🆔 UID : ${uid}
            </div>

            <div class="result-card">
            🌍 Region : IND
            </div>

            <div class="result-card">
            ❤️ Likes Before : ${before}
            </div>

            <div class="result-card">
            🚀 Likes Now : ${now}
            </div>

            <div class="result-card">
            ⚡ Likes Given : ${given}
            </div>

            `;
        }

        else{

            failSfx.play();

            showToast("SERVER BUSY • TRY AGAIN");
        }

    },delay);
}

/* ========================= */
/* CLOSE */
/* ========================= */

function closeDialog(){

    clickSfx.play();

    document.getElementById("dialog")
    .style.display="none";
}

/* ========================= */
/* TOAST */
/* ========================= */

function showToast(message){

    const toast=
    document.createElement("div");

    toast.innerText=message;

    toast.style.position="fixed";
    toast.style.bottom="30px";
    toast.style.left="50%";
    toast.style.transform="translateX(-50%)";

    toast.style.padding="16px 28px";

    toast.style.borderRadius="18px";

    toast.style.background=
    "rgba(0,0,0,.65)";

    toast.style.color="white";

    toast.style.fontWeight="600";

    toast.style.backdropFilter=
    "blur(18px)";

    toast.style.border=
    "1px solid rgba(255,255,255,.08)";

    toast.style.zIndex="999999";

    toast.style.opacity="0";

    toast.style.transition=".4s";

    document.body.appendChild(toast);

    setTimeout(()=>{

        toast.style.opacity="1";

        toast.style.bottom="50px";

    },50);

    setTimeout(()=>{

        toast.style.opacity="0";

        toast.style.bottom="20px";

        setTimeout(()=>{

            toast.remove();

        },400);

    },2500);
}

/* ========================= */
/* THEMES */
/* ========================= */

let currentTheme="night";

function setTheme(theme,button){

    currentTheme=theme;

    document.querySelectorAll(".theme-btn")
    .forEach(btn=>btn.classList.remove("active-theme"));

    button.classList.add("active-theme");

    const rain=
    document.getElementById("rainContainer");

    const clouds=
    document.getElementById("clouds");

    const moon=
    document.getElementById("moon");

    const space=
    document.getElementById("spaceEffects");

    if(theme==="night"){

        document.body.style.background=
        "radial-gradient(circle at center,#07111f 0%,#02040b 70%)";

        rain.style.display="none";

        clouds.style.opacity="0";

        moon.style.opacity="1";

        space.style.opacity="1";
    }

    if(theme==="rain"){

        document.body.style.background=
        "radial-gradient(circle at center,#0b1626 0%,#02040b 80%)";

        rain.style.display="block";

        clouds.style.opacity="1";

        moon.style.opacity=".4";

        space.style.opacity=".15";

        createRain();
    }
}

/* ========================= */
/* CREATE RAIN */
/* ========================= */

function createRain(){

    const rain=
    document.getElementById("rainContainer");

    rain.innerHTML="";

    for(let i=0;i<180;i++){

        const drop=
        document.createElement("div");

        drop.classList.add("raindrop");

        drop.style.left=
        Math.random()*100+"%";

        drop.style.animationDuration=
        (Math.random()*1+.5)+"s";

        drop.style.opacity=
        Math.random();

        rain.appendChild(drop);
    }
}

/* ========================= */
/* LIGHTNING */
/* ========================= */

function triggerLightning(){

    if(currentTheme!=="rain")
    return;

    const lightning=
    document.getElementById("lightning");

    lightning.classList.add("flash");

    const thunder=
    new Audio(
    'https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.mp3'
    );

    thunder.volume=.7;

    thunder.play();

    setTimeout(()=>{

        lightning.classList.remove("flash");

    },250);
}

setInterval(()=>{

    if(currentTheme==="rain"){

        if(Math.random()>.55){

            triggerLightning();
        }
    }

},5000);

</script>

</body>
</html>
